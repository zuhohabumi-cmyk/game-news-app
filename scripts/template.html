  <title>ゲームニュース | Game Dispatch</title>
  <style>
    :root{color-scheme:dark;--bg:#0d131b;--panel:#161e29;--line:#2b3645;--ink:#eef3fa;--muted:#a2afc1;--lime:#b9ed87;--purple:#c5b4ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.6}a{color:inherit}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:4px}button:disabled{cursor:default}.wrap{max-width:1220px;width:calc(100% - 48px);margin:auto}.masthead{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:32px 0 25px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.brand img{width:42px;height:42px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--lime);font-weight:800}h1{font-size:25px;letter-spacing:-.03em;line-height:1.2;margin:3px 0 0}.edition{text-align:right;font-size:12px;color:var(--muted)}.edition strong{color:var(--ink);display:block;font-weight:500}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:28px 0 18px}.intro h2{font-size:clamp(25px,4vw,40px);letter-spacing:-.045em;margin:0;line-height:1.3}.intro p{color:var(--muted);font-size:13px;margin:7px 0 0}.live{white-space:nowrap;color:var(--lime);font-size:11px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--lime);margin-right:7px}.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin:6px 0 26px}.spotlight{border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-height:280px;background:var(--panel);display:flex;align-items:end;text-decoration:none}.spotlight img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.6}.spotlight::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0d131bf2,transparent 110%)}.spotlight-content{z-index:1;position:relative;padding:28px;width:100%}.spotlight h3{font-size:clamp(23px,3vw,35px);margin:12px 0 8px;line-height:1.25;letter-spacing:-.035em}.spotlight p{font-size:12px;color:#d9e2ef;margin:0}.flag{font-size:10px;color:var(--bg);background:var(--lime);padding:4px 9px;border-radius:3px;font-weight:800;letter-spacing:.09em}.next-event{padding:25px 27px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#26322c,var(--panel) 65%);display:flex;flex-direction:column}.next-event h3{font-size:24px;line-height:1.4;margin:12px 0}.next-event p{font-size:12px;color:var(--muted);margin:0 0 12px}.next-event .event-date{color:var(--lime);font-size:20px;letter-spacing:-.02em}.next-event a{font-size:12px;color:var(--lime);text-decoration:none;margin-top:auto}.nav-wrap{position:sticky;top:0;z-index:10;background:#0d131bf5;backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.categories{display:flex;gap:4px;overflow-x:auto;padding:12px 0;scrollbar-width:thin}.category-button{background:transparent;border:0;border-radius:6px;color:var(--muted);font-size:12px;white-space:nowrap;padding:9px 14px}.category-button[aria-pressed=true]{background:var(--lime);color:var(--bg);font-weight:700}.category-button small{margin-left:8px;opacity:.7}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 10px}.search{position:relative;flex:1;min-width:190px}.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:13px}.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 12px;color:var(--muted);font-size:12px;max-width:100%}.read-filter{display:flex;gap:4px;border:1px solid var(--line);padding:3px;border-radius:7px}.read-filter button{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:4px;font-size:12px}.read-filter button[aria-pressed=true]{background:#344255;color:var(--ink)}.result-info{font-size:11px;color:var(--muted);margin:12px 0 0}.section{padding:25px 0 8px;scroll-margin-top:90px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin-bottom:17px}.section-head h2{font-size:22px;letter-spacing:-.03em;margin:0}.section-head p{color:var(--muted);font-size:11px;margin:3px 0 0}.section-head span{font-size:11px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0;transition:border-color .15s}.card:hover{border-color:#576b83}.card.read{opacity:.64}.cover{width:100%;aspect-ratio:460/215;object-fit:cover;background:#25313f;display:block}.body{padding:19px 20px;display:flex;flex:1;flex-direction:column}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted);margin-bottom:10px}.kind{color:var(--lime);letter-spacing:.04em;font-weight:700}.stale{color:#ffcb8b;border:1px solid #8e6837;padding:1px 5px;border-radius:3px}.headline{font-size:17px;line-height:1.55;margin:0 0 10px;overflow-wrap:anywhere}.headline a{text-decoration:none}.headline a:hover{color:var(--lime)}.summary{font-size:12px;line-height:1.8;color:#b5c1d1;margin:0 0 14px}.label{color:var(--muted);font-size:10px;margin:3px 0}.review{font-size:11px;color:var(--lime);margin:0 0 7px}.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:2px 0 13px}.tag{border:1px solid #3c4a5c;border-radius:3px;padding:1px 6px}.price-row{display:flex;gap:9px;align-items:center;margin:2px 0 9px;flex-wrap:wrap}.discount{background:var(--lime);color:var(--bg);font-weight:800;padding:2px 7px;border-radius:3px;font-size:12px}.price{font-size:18px;font-weight:700}.price-row del{font-size:11px;color:var(--muted)}.event-card .body{background:linear-gradient(145deg,#22283b,var(--panel) 70%)}.event-card .event-date{color:var(--purple);font-size:19px;margin:5px 0 12px}.extract{font-size:11px;color:var(--muted);margin-bottom:12px}.extract summary{cursor:pointer}.extract p{margin:5px 0;overflow-wrap:anywhere}.footer-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}.footer-card a{font-size:11px;text-decoration:none;color:var(--lime)}.read-button{border:0;background:transparent;font-size:11px;color:var(--muted);padding:4px}.origins{font-size:10px;color:var(--muted);margin-bottom:12px}.origins a{color:var(--muted);margin-right:8px}.empty{border:1px dashed var(--line);border-radius:8px;padding:26px;font-size:12px;color:var(--muted);grid-column:1/-1}.more{display:block;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;padding:9px 22px;margin:16px auto 0}.source-status{margin:40px 0 20px;padding:20px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px}.source-status summary{cursor:pointer;color:var(--ink)}.status-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.status-item{border:1px solid var(--line);padding:7px 10px;border-radius:5px}.status-item.warn{color:#ffcb8b}.notice{font-size:11px;line-height:1.9;color:var(--muted);margin:15px 0}.bottom{padding:20px 0 36px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:15px}main{padding-bottom:15px}.ai-label{color:var(--purple)}.hidden{display:none}
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1.4fr 1fr}.next-event{padding:21px}.next-event h3{font-size:21px}}
    @media(max-width:620px){.wrap{width:calc(100% - 28px)}.masthead{padding:20px 0;gap:10px}.brand img{width:34px;height:34px}h1{font-size:20px}.eyebrow{font-size:8px}.edition{font-size:10px;max-width:120px}.intro{padding-top:23px}.live{display:none}.hero{grid-template-columns:1fr;gap:12px}.spotlight{min-height:230px}.spotlight-content{padding:22px}.next-event{min-height:0;padding:20px}.next-event h3{font-size:20px;margin:8px 0}.next-event a{margin-top:9px}.grid{grid-template-columns:1fr;gap:12px}.toolbar{gap:8px}.search{flex-basis:100%}.toolbar select{flex:1;min-width:0;padding:10px 7px}.read-filter{flex-shrink:0}.read-filter button{padding:7px}.body{padding:18px}.category-button{padding:8px 11px}.section-head h2{font-size:20px}.section-head p{max-width:250px}.bottom{display:block}.section{padding-top:21px}.section-head{align-items:start}}

<body>
  <header class="wrap"><div class="masthead"><div class="brand"><img src="icon.svg" alt=""><div><div class="eyebrow">GAME DISPATCH / PERSONAL EDITION</div><h1>ゲームニュース</h1></div></div><div class="edition">最終更新<strong id="updated-at">未更新</strong></div></div>
    <div class="intro"><div><h2>次に遊びたいゲームを、見つけよう。</h2><p>話題作から週末のセールまで。ゲームの今を、ひとつのページに。</p></div><div class="live"><span class="dot"></span>STEAM JP + GAME NEWS</div></div>
    <div class="hero" id="hero"></div>
  </header>
  <div class="nav-wrap"><nav class="wrap categories" id="categories" aria-label="カテゴリ"></nav></div>
  <main class="wrap">
    <div class="toolbar"><div class="search"><input id="search" type="search" aria-label="ゲーム・記事を検索" placeholder="ゲーム名・ジャンル・キーワードで検索"></div>
      <select id="kind" aria-label="情報の種類"><option value="all">すべての情報</option><option value="game">Steamゲーム</option><option value="article">ニュース記事</option><option value="event">公式イベント</option></select>
      <select id="offer" aria-label="セールの種類"><option value="all">すべてのオファー</option><option value="discount">割引セール</option><option value="giveaway">無料配布の報道</option><option value="freeplay">無料プレイの報道</option></select>
      <div class="read-filter" id="read-filter" aria-label="既読状態"></div>
    </div><p class="result-info" id="result-info" role="status"></p><div id="sections"></div>
    <details class="source-status"><summary id="source-summary">情報源と取得状況</summary><div class="status-grid" id="sources"></div><p id="ai-status"></p><p class="notice">価格は日本ストアの取得時点の情報です。購入・無料配布の条件と終了時刻は元のストア／記事で確認してください。基本無料は無料配布と区別しています。過去最安、SNS急上昇、レビューの伸びは初版では判定していません。</p></details>
  </main><footer class="wrap bottom"><span>GAME DISPATCH — 気になるゲームを、毎日の習慣に。</span><span>Steam JP · 出典と取得日時を表示</span></footer>
  <script id="news-data" type="application/json">__NEWS_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('news-data').textContent);
    const items = [...(data.games || []), ...(data.articles || []), ...(data.events || [])];
    const categoryMeta = { '話題':['🔥','話題','Steam売れ筋と、メディアで注目されたゲーム。'], '好評':['⭐','好評','取得対象のうち100件以上・好評率80%以上。'], '新作':['🆕','新作','Steamの新作欄と発売予定、メディアの発表。'], 'セール':['💰','セール','割引情報と、無料配布・無料プレイの報道。'], 'イベント':['🎮','イベント','Steam公式の開催予定と、大型イベント情報。'], 'ニュース':['📰','ニュース','発表、DLC、アップデート、ゲーム業界の動き。'] };
    const storageKey = 'game_news_read_ids_v1';
    let readIds;
    try { const saved = JSON.parse(localStorage.getItem(storageKey) || '[]'); readIds = new Set(Array.isArray(saved) ? saved : []); } catch { readIds = new Set(); }
    let selectedCategory = 'all', readFilter = 'all', query = '', kind = 'all', offer = 'all';
    const expanded = new Set();
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    const safeUrl = v => { try { const u = new URL(v); return ['https:','http:'].includes(u.protocol) ? esc(u.toString()) : ''; } catch { return ''; } };
    const fmtTime = v => { const d = new Date(v); return Number.isFinite(d.getTime()) ? new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d) : '日時不明'; };
    const countText = v => Number(v).toLocaleString('ja-JP');
    const priceText = g => g.currentPrice === null || !g.currency ? '価格未発表 / 未取得' : g.offerType === 'free-to-play' ? '基本無料' : new Intl.NumberFormat('ja-JP',{style:'currency',currency:g.currency,maximumFractionDigits:g.currency==='JPY'?0:2}).format(g.currentPrice);
    const range = e => `${e.startDate.replaceAll('-','/')} – ${e.endDate.replaceAll('-','/')}`;
    const labels = {'Overwhelmingly Positive':'圧倒的に好評','Very Positive':'非常に好評','Mostly Positive':'やや好評','Positive':'好評','Mixed':'賛否両論','Mostly Negative':'やや不評','Negative':'不評','Very Negative':'非常に不評','Overwhelmingly Negative':'圧倒的に不評'};
    const url = a => safeUrl(a.steamUrl || a.link);
    const dated = a => `<time>${esc(fmtTime(a.kind==='article' ? (a.timestamp || a.fetchedAt) : a.fetchedAt))}${a.kind==='article'?' 掲載':' 取得'}</time>${a.stale?'<span class="stale">前回取得</span>':''}`;
    function setRead(id) { readIds.has(id) ? readIds.delete(id) : readIds.add(id); try { localStorage.setItem(storageKey,JSON.stringify([...readIds].slice(-2000))); } catch {} render(); }
    function footer(a,label) { return `<div class="footer-card"><a href="${url(a)}" target="_blank" rel="noopener noreferrer" data-open="${esc(a.id)}">${label} ↗</a><button type="button" class="read-button" data-read="${esc(a.id)}" aria-label="${esc(a.title)}を${readIds.has(a.id)?'未読':'既読'}にする">${readIds.has(a.id)?'✓ 既読':'○ 未読'}</button></div>`; }
    function gameCard(g) {
      const img = safeUrl(g.thumbnail);
      const review = g.reviewCount === null ? 'レビュー未取得' : g.reviewCount===0 ? 'レビューなし' : `${labels[g.reviewLabel] || esc(g.reviewLabel)} · 好評 ${g.positivePercent}% / ${countText(g.reviewCount)}件`;
      return `<article class="card ${readIds.has(g.id)?'read':''}">${img?`<a href="${url(g)}" target="_blank" rel="noopener noreferrer" data-open="${esc(g.id)}" aria-label="${esc(g.title)}のSteamページ"><img class="cover" src="${img}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>`:''}<div class="body"><div class="meta"><span class="kind">STEAM ${g.comingSoon?'· 発売予定':g.ranks.top_sellers?'· 売れ筋掲載 #'+g.ranks.top_sellers:''}</span>${dated(g)}</div><h3 class="headline"><a href="${url(g)}" target="_blank" rel="noopener noreferrer" data-open="${esc(g.id)}">${esc(g.title)}</a></h3><p class="review">${review}</p><div class="facts"><span>発売 ${esc(g.releaseDate || '未定')}</span>${g.japaneseSupported?'<span class="tag">日本語対応</span>':''}${g.genres.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="price-row">${g.discountPercent?`<span class="discount">−${g.discountPercent}%</span><del>${esc(new Intl.NumberFormat('ja-JP',{style:'currency',currency:g.currency||'JPY',maximumFractionDigits:0}).format(g.originalPrice))}</del>`:''}<span class="price">${g.stale?'前回 ':''}${esc(priceText(g))}</span></div>${g.offerType==='zero-price-offer'?'<p class="label">0円オファー・取得条件をストアで確認</p>':''}${g.saleEndsAt?`<p class="label">終了予定 ${esc(fmtTime(g.saleEndsAt))} JST</p>`:''}<p class="label ${g.aiSummary?'ai-label':''}">${g.aiSummary?'関連ニュースのAI要約':'Steamの説明抜粋'}</p><p class="summary">${esc(g.aiSummary?.text || g.description || '説明未取得')}</p><details class="extract"><summary>言語・取得情報</summary><p>${esc(g.supportedLanguages || '言語情報未取得')}</p><p>レビュー集計: ${esc(g.reviewScope)}</p><p>商品: ${esc(fmtTime(g.detailsFetchedAt))} / レビュー: ${g.reviewsFetchedAt?esc(fmtTime(g.reviewsFetchedAt)):'未取得'}</p>${g.aiSummary?`<a href="${safeUrl(g.aiSummary.link)}" target="_blank" rel="noopener noreferrer">要約の元記事 ↗</a>`:''}</details>${footer(g,'Steamで確認')}</div></article>`;
    }
    function articleCard(a) {
      const offers = {'giveaway-reported':'無料配布の報道','free-play-reported':'無料プレイの報道','sale-reported':'セールの報道'};
      const extracts = [['発売日',a.releaseDate],['セール',a.saleInfo],['イベント期間',a.eventPeriod]].filter(x=>x[1]);
      return `<article class="card ${readIds.has(a.id)?'read':''}"><div class="body"><div class="meta"><span class="kind">${esc(a.sourceName)}</span>${dated(a)}</div><h3 class="headline"><a href="${url(a)}" target="_blank" rel="noopener noreferrer" data-open="${esc(a.id)}">${esc(a.title)}</a></h3><div class="facts">${offers[a.offerType]?`<span class="tag">${offers[a.offerType]}</span>`:''}${a.gameTitles.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="label ${a.aiSummary?'ai-label':''}">${a.aiSummary?'AI要約 · 内容は元記事で確認':'RSS抜粋'}</p><p class="summary">${esc(a.aiSummary || a.snippet || '配信元に説明抜粋がありません。元記事をご覧ください。')}</p>${extracts.length?`<details class="extract"><summary>抽出された日付・条件</summary>${extracts.map(([label,v])=>`<p>${label}: ${esc(v.text)}<br>根拠「${esc(v.evidence)}」</p>`).join('')}</details>`:''}${a.sources.length>1?`<div class="origins">関連する出典 ${a.sources.map(s=>`<a href="${safeUrl(s.link)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ↗</a>`).join('')}</div>`:''}${a.offerType?'<p class="label">掲載時点の報道です。期間・対象条件を元記事で確認。</p>':''}${footer(a,'元記事を読む')}</div></article>`;
    }
    function eventCard(e) { return `<article class="card event-card ${readIds.has(e.id)?'read':''}"><div class="body"><div class="meta"><span class="kind">${esc(e.sourceName)}</span>${dated(e)}</div><h3 class="headline"><a href="${url(e)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a></h3><p class="event-date">${esc(range(e))}</p><p class="summary">${esc(e.dateBasis)}。開催内容・時間は公式案内で確認できます。</p>${footer(e,'公式日程を確認')}</div></article>`; }
    function matches(a) {
      if (kind!=='all' && a.kind!==kind) return false;
      if (readFilter==='unread' && readIds.has(a.id) || readFilter==='read' && !readIds.has(a.id)) return false;
      if (offer==='discount' && !['discount','sale-reported','zero-price-offer'].includes(a.offerType)) return false;
      if (offer==='giveaway' && a.offerType!=='giveaway-reported') return false;
      if (offer==='freeplay' && a.offerType!=='free-play-reported') return false;
      const text = [a.title,a.snippet,a.description,a.sourceName,...(a.genres||[]),...(a.gameTitles||[])].join(' ').normalize('NFKC').toLowerCase();
      return query.split(/\s+/).filter(Boolean).every(word=>text.includes(word));
    }
    function sortCategory(list,cat) {
      return [...list].sort((a,b)=> {
        if(a.stale!==b.stale) return Number(Boolean(a.stale))-Number(Boolean(b.stale));
        if(a.kind!==b.kind) return (a.kind==='game'||a.kind==='event'?-1:1);
        if(cat==='好評'&&a.kind==='game') return b.positivePercent-a.positivePercent || b.reviewCount-a.reviewCount;
        if(cat==='セール'&&a.kind==='game') return b.discountPercent-a.discountPercent;
        if(cat==='話題'&&a.kind==='game') return (a.ranks.top_sellers||99)-(b.ranks.top_sellers||99);
        if(a.kind==='event') return a.startDate.localeCompare(b.startDate);
        return (b.timestamp||0)-(a.timestamp||0);
      });
    }
    function render() {
      const filtered = items.filter(matches);
      document.getElementById('categories').replaceChildren(...[['all','すべて'],...Object.entries(categoryMeta).map(([c,m])=>[c,m[0]+' '+m[1]])].map(([c,label])=>{
        const b=document.createElement('button'); b.className='category-button'; b.type='button'; b.setAttribute('aria-pressed',String(c===selectedCategory)); const n=filtered.filter(a=>c==='all'||a.categories.includes(c)).length; b.innerHTML=`${label}<small>${n}</small>`; b.addEventListener('click',()=>{selectedCategory=c;expanded.clear();render();});return b;
      }));
      document.getElementById('read-filter').replaceChildren(...[['all','全件'],['unread','未読'],['read','既読']].map(([id,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(readFilter===id));b.addEventListener('click',()=>{readFilter=id;render();});return b;}));
      const shown = filtered.filter(a=>selectedCategory==='all'||a.categories.includes(selectedCategory));
      document.getElementById('result-info').textContent=`${shown.length}件の情報 · ゲーム ${shown.filter(a=>a.kind==='game').length} / 記事 ${shown.filter(a=>a.kind==='article').length} / 公式日程 ${shown.filter(a=>a.kind==='event').length}`;
      const cats=selectedCategory==='all'?Object.keys(categoryMeta):[selectedCategory];
      document.getElementById('sections').innerHTML=cats.map(cat=>{const m=categoryMeta[cat], list=sortCategory(filtered.filter(a=>a.categories.includes(cat)),cat), limited=expanded.has(cat)?list:list.slice(0,6);return `<section class="section"><div class="section-head"><div><h2>${m[0]} ${cat}</h2><p>${m[2]}</p></div><span>${list.length}件</span></div><div class="grid">${limited.length?limited.map(a=>a.kind==='game'?gameCard(a):a.kind==='event'?eventCard(a):articleCard(a)).join(''):'<div class="empty">この条件に一致する情報はありません。検索条件または情報源の取得状況をご確認ください。</div>'}</div>${list.length>6&&!expanded.has(cat)?`<button type="button" class="more" data-more="${cat}">残り${list.length-6}件を表示 ↓</button>`:''}</section>`;}).join('');
      document.querySelectorAll('[data-read]').forEach(b=>b.addEventListener('click',()=>setRead(b.dataset.read)));
      document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{readIds.add(a.dataset.open);try{localStorage.setItem(storageKey,JSON.stringify([...readIds].slice(-2000)));}catch{} render();}));
      document.querySelectorAll('[data-more]').forEach(b=>b.addEventListener('click',()=>{expanded.add(b.dataset.more);render();}));
    }
    const spotlightGame=(data.games||[]).find(g=>g.ranks.top_sellers&&!g.stale), next=(data.events||[]).find(e=>!e.stale);
    document.getElementById('hero').innerHTML=`${spotlightGame?`<a class="spotlight" href="${url(spotlightGame)}" target="_blank" rel="noopener noreferrer">${safeUrl(spotlightGame.thumbnail)?`<img src="${safeUrl(spotlightGame.thumbnail)}" alt="" referrerpolicy="no-referrer">`:''}<div class="spotlight-content"><span class="flag">ON THE RADAR / STEAM売れ筋</span><h3>${esc(spotlightGame.title)}</h3><p>Steam売れ筋掲載 #${spotlightGame.ranks.top_sellers} · ${esc(priceText(spotlightGame))} · ストアで確認 ↗</p></div></a>`:'<div class="spotlight"><div class="spotlight-content"><span class="flag">GAME DISPATCH</span><h3>ゲームの今を、ここから。</h3><p>Steamの取得状況はページ下部で確認できます。</p></div></div>'}<aside class="next-event"><div class="eyebrow">UP NEXT / 公式イベント予定</div>${next?`<h3>${esc(next.title)}</h3><p class="event-date">${esc(range(next))}</p><p>Steam公式の掲載日付（現地日付）</p><a href="${url(next)}" target="_blank" rel="noopener noreferrer">公式の開催情報を見る ↗</a>`:'<h3>次のイベントをチェック</h3><p>現在の公式日程を取得できていません。</p><a href="https://partner.steamgames.com/doc/marketing/upcoming_events" target="_blank" rel="noopener noreferrer">Steam公式日程を見る ↗</a>'}</aside>`;
    document.getElementById('updated-at').textContent=fmtTime(data.updatedAt)+' JST';
    const warnings=(data.sources||[]).filter(s=>!['ok'].includes(s.status));
    document.getElementById('source-summary').textContent=`情報源と取得状況${warnings.length?' · '+warnings.length+'件の注意あり':''}`;
    document.getElementById('sources').innerHTML=(data.sources||[]).map(s=>`<div class="status-item ${s.status!=='ok'?'warn':''}">${esc(s.name)} · ${esc(({ok:'取得成功',partial:'一部取得失敗',error:'取得失敗',empty:'新着なし'})[s.status]||s.status)} / ${s.count}件${s.fetchedAt?'<br>'+esc(fmtTime(s.fetchedAt))+' 取得':''}${s.previousFetchedAt?'<br>前回 '+esc(fmtTime(s.previousFetchedAt)):''}</div>`).join('');
    document.getElementById('ai-status').textContent=data.ai?.reason||'AI未使用';
    document.getElementById('search').addEventListener('input',e=>{query=e.target.value.normalize('NFKC').toLowerCase().trim();render();});
    document.getElementById('kind').addEventListener('change',e=>{kind=e.target.value;render();});
    document.getElementById('offer').addEventListener('change',e=>{offer=e.target.value;if(offer!=='all')selectedCategory='セール';render();});
    render();
  </script>
</body>
</html>
